<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>Anthropic API key</title>
    <style>
      body { margin: 0; padding: 18px; font: 13px -apple-system, Helvetica, sans-serif; background: #fffdf7; color: #101018; }
      p { margin: 0 0 10px; line-height: 1.4; }
      input { width: 100%; box-sizing: border-box; padding: 7px 9px; font: 13px ui-monospace, Menlo, monospace; border: 2px solid #101018; border-radius: 8px; }
      .row { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
      button { font: inherit; padding: 5px 14px; border: 2px solid #101018; border-radius: 8px; background: #fff; cursor: pointer; }
      button.primary { background: #ff7a2f; color: #fff; }
      #status { margin-top: 10px; min-height: 1.4em; color: #8a3a10; }
    </style>
  </head>
  <body>
    <p>No <code>claude</code> CLI found, so the duck can chat through the Anthropic API instead. Paste a key from console.anthropic.com. It is kept in your login Keychain, never in a file.</p>
    <input id="key" type="password" placeholder="sk-ant-…" autofocus />
    <div class="row">
      <button id="remove">Remove key</button>
      <button id="cancel">Cancel</button>
      <button id="save" class="primary">Save</button>
    </div>
    <div id="status"></div>
    <script src="keyprompt.js"></script>
  </body>
</html>
