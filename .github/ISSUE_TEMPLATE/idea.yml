name: Can it do X?
description: Something you wish the duck did.
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What should the duck do?
      placeholder: '"Walk over when I get a Slack message", "Fetch the ball with its beak", "A green duck"'
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: When would you use it?
